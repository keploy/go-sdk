name: Build Keploy's Go-SDK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Install dependencies
      run: go mod tidy

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
  # keploytest leans on how package testing runs a test (the order of its
  # cleanups, how FailNow and t.Run end a goroutine, stack frame names), so it
  # is tested on the module's oldest Go and on the latest, with the race
  # detector.
  keploytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ "1.21", "stable" ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Vet keploytest
      run: go vet ./keploytest/

    - name: Test keploytest
      run: go test -race -count=1 ./keploytest/
